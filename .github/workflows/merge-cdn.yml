name: Build merged CDN rules

on:
  schedule:
    - cron: '0 2 * * *'  # Раз в день в 5 утра по мск
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all source lists and merge
        run: |
          mkdir -p rules

          URLS=(
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/akamai.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/amazon.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/cdn77.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/cloudflare.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/digitalocean.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/fastly.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/hetzner.list"
            "https://github.com/toneywhitez/zkeen_rules/releases/latest/download/leaseweb_ips.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/oracle.list"
            "https://github.com/toneywhitez/zkeen_rules/releases/latest/download/ovh_ips.list"
            "https://github.com/toneywhitez/zkeen_rules/releases/latest/download/scaleway_ips.list"
            "https://raw.githubusercontent.com/efremych/ShadowRocket/refs/heads/main/rules/vodafone.list"
          )

          DOMAINS_FILE="/tmp/all_domains.tmp"
          IPS_FILE="/tmp/all_ips.tmp"
          ASNS_FILE="/tmp/all_asns.tmp"
          > "$DOMAINS_FILE"
          > "$IPS_FILE"
          > "$ASNS_FILE"

          for url in "${URLS[@]}"; do
            echo "Скачиваем: $url"
            curl -sL "$url" | tr -d '\r' | grep -v '^[[:space:]]*$' | grep -v '^#' > /tmp/current.list

            # Исправляем задвоенные префиксы
            sed -i 's/^IP-CIDR,IP-CIDR,/IP-CIDR,/' /tmp/current.list
            sed -i 's/^IP-CIDR6,IP-CIDR6,/IP-CIDR6,/' /tmp/current.list

            # Разделяем на домены, IP и ASN (если попадутся в источниках)
            grep -E '^(DOMAIN-SUFFIX|DOMAIN),' /tmp/current.list >> "$DOMAINS_FILE" || true
            grep -E '^(IP-CIDR|IP-CIDR6),' /tmp/current.list >> "$IPS_FILE" || true
            grep -E '^IP-ASN,' /tmp/current.list >> "$ASNS_FILE" || true
          done

          # Добавляем вручную указанные ASN
          echo "IP-ASN,39572 # DataWeb" >> "$ASNS_FILE"

          # Сортируем и убираем дубликаты
          sort -u "$DOMAINS_FILE" -o "$DOMAINS_FILE"
          sort -u "$IPS_FILE" -o "$IPS_FILE"
          sort -u "$ASNS_FILE" -o "$ASNS_FILE"

          DOMAIN_COUNT=$(wc -l < "$DOMAINS_FILE")
          IP_COUNT=$(wc -l < "$IPS_FILE")
          ASN_COUNT=$(wc -l < "$ASNS_FILE")
          TOTAL=$((DOMAIN_COUNT + IP_COUNT + ASN_COUNT))

          echo "Доменов: $DOMAIN_COUNT, IP: $IP_COUNT, ASN: $ASN_COUNT"

          {
            echo "# NAME: cdn_merged"
            echo "# AUTHOR: efremych (merged from multiple sources)"
            echo "# REPO: https://github.com/efremych/ShadowRocket"
            echo "# UPDATED: $(TZ='Europe/Moscow' date '+%Y-%m-%d %H:%M:%S')"
            echo "# SOURCE: akamai, amazon, cdn77, cloudflare, digitalocean, fastly, hetzner, leaseweb, oracle, ovh, scaleway, vodafone, ASN DataWeb"
            echo "# DOMAIN: ${DOMAIN_COUNT}"
            echo "# IP-CIDR: ${IP_COUNT}"
            echo "# IP-ASN: ${ASN_COUNT}"
            echo "# TOTAL: ${TOTAL}"
            echo ""
            echo "# ===== DOMAINS ====="
            cat "$DOMAINS_FILE"
            echo ""
            echo "# ===== IPs ====="
            cat "$IPS_FILE"
            echo ""
            echo "# ===== ASNs ====="
            cat "$ASNS_FILE"
          } > rules/cdn_merged.list

          echo "✅ cdn_merged.list создан: $TOTAL правил"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rules/cdn_merged.list
          git diff --staged --quiet || git commit -m "Auto-update merged CDN rules [skip ci]"
          git push
